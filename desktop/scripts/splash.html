<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Proteus</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-app-region:drag;user-select:none;cursor:default}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bar{position:absolute;left:50%;bottom:7%;width:44%;height:3px;transform:translateX(-50%);background:#ffffff22;border-radius:2px;overflow:hidden}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#ff7a1a,#3fd6ff);animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
</style></head>
<body><img src="splash.jpg" alt=""><div class="bar"><div></div></div></body></html>
